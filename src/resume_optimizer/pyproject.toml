[project]
name = "resume-optimizer"
version = "0.1.0"
description = "CrewAI-based resume optimization for Swedish job market"
requires-python = ">=3.10"
dependencies = [
    "crewai[tools]>=0.95.0,<1.0.0",
]

[project.scripts]
resume-optimizer = "resume_optimizer.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_optimizer"]

[tool.crewai]
type = "crew"
